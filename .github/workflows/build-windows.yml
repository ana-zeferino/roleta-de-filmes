name: Build Windows (.exe)

# Gera o .exe numa máquina Windows da nuvem e anexa na Release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da Release onde anexar o .exe (ex: v1.0.0)"
        required: true
        default: "v1.0.0"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pythonnet

      - name: Gerar ícone .ico
        run: |
          python -c "from PIL import Image; Image.open('build_assets/icon_1024.png').save('build_assets/icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Empacotar com PyInstaller
        run: pyinstaller roleta.spec --noconfirm

      - name: Renomear saída
        run: Copy-Item "dist/Roleta de Filmes.exe" "dist/Roleta-de-Filmes-Windows.exe"

      - name: Upload do artefato (sempre)
        uses: actions/upload-artifact@v4
        with:
          name: Roleta-de-Filmes-Windows
          path: "dist/Roleta-de-Filmes-Windows.exe"

      - name: Anexar na Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if (-not $tag) { $tag = "${{ github.event.release.tag_name }}" }
          gh release upload $tag "dist/Roleta-de-Filmes-Windows.exe" --clobber --repo ${{ github.repository }}
